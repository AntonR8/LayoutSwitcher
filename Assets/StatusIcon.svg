<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="outer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f9090"/>
      <stop offset="0.45" stop-color="#c8c8c5"/>
      <stop offset="1" stop-color="#777878"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f0ec"/>
      <stop offset="0.5" stop-color="#d8d8d5"/>
      <stop offset="1" stop-color="#a9aaa9"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfa"/>
      <stop offset="0.62" stop-color="#eeeeec"/>
      <stop offset="1" stop-color="#d3d4d3"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dy="7"/>
      <feComponentTransfer><feFuncA type="linear" slope=".42"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- soft shadow -->
  <rect x="55" y="55" width="402" height="402" rx="92" fill="#000" opacity=".28" filter="url(#soft)"/>

  <!-- outer body -->
  <rect x="44" y="36" width="424" height="424" rx="98" fill="url(#outer)" stroke="#666766" stroke-width="3"/>
  <rect x="54" y="46" width="404" height="404" rx="88" fill="none" stroke="#deded9" stroke-opacity=".65" stroke-width="5"/>

  <!-- inner bezel -->
  <rect x="69" y="61" width="374" height="374" rx="72" fill="url(#frame)" stroke="#f7f7f4" stroke-width="5"/>
  <rect x="80" y="72" width="352" height="352" rx="63" fill="#c5c6c5" stroke="#8b8c8b" stroke-width="4"/>

  <!-- keycap -->
  <rect x="94" y="86" width="324" height="324" rx="45" fill="#252728" opacity=".55"/>
  <rect x="99" y="80" width="314" height="314" rx="43" fill="url(#key)" stroke="#fafafa" stroke-width="4"/>
  <rect x="107" y="88" width="298" height="298" rx="37" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="3"/>
  <path d="M116 355 Q120 378 143 384 L369 384 Q391 378 396 355" fill="none" stroke="#a5a6a5" stroke-width="4" opacity=".45"/>

  <!-- shift arrow -->
  <path d="M256 112 L146 230 L200 230 L200 352 L312 352 L312 230 L366 230 Z"
        fill="none" stroke="#55585a" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M256 136 L176 222 L214 222 L214 338 L298 338 L298 222 L336 222 Z"
        fill="none" stroke="#727578" stroke-width="5" stroke-linejoin="round"/>
</svg>